# Release package v1.0.0. Import from GitHub with packages:
#   easyhome: github://Fredzxda/esphome-aldes-easyhome/packages/easyhome.yaml@main
#
# Manual Boost TX test: inverted TX GPIO1, RX GPIO3.
# Optional room labels supplied by the consuming YAML: piece_1, piece_2, piece_3.
external_components:
  - source:
      type: git
      url: https://github.com/Fredzxda/esphome-aldes-easyhome
      ref: main
    components: [aldes_ibus]
    refresh: always

uart:
  # Reserve UART0 without using the iBUS pins; ESPHome assigns UARTs in declaration order.
  - id: uart_reserve
    tx_pin: GPIO25
    baud_rate: 9600

  - id: easyhome_uart
    tx_pin:
      number: GPIO1
      inverted: true
    rx_pin:
      number: GPIO3
      inverted: false
    baud_rate: 2400
    data_bits: 8
    parity: EVEN
    stop_bits: 1
    rx_buffer_size: 1024

aldes_ibus:
  id: easyhome_ibus
  uart_id: easyhome_uart
  rx_led: ibus_rx_led
  connected:
    name: "iBUS Connecté"
    entity_category: diagnostic
  raw_rx:
    name: "iBUS RX brut hex"  # VMC response only; TX echo excluded
  last_frame:
    name: "iBUS Derniere trame VMC"
  last_long_frame:
    name: "iBUS Derniere trame longue VMC"
  frames_ok:
    name: "iBUS Trames valides"
  checksum_bad:
    name: "iBUS Checksums invalides"
  sync_errors:
    name: "iBUS Erreurs de synchronisation"
  rx_bytes:
    name: "iBUS Octets recus"
  temperature_1:
    name: "Température ${piece_1}"
  humidity_1:
    name: "Humidité ${piece_1}"
  temperature_2:
    name: "Température ${piece_2}"
  humidity_2:
    name: "Humidité ${piece_2}"
  temperature_3:
    name: "Température ${piece_3}"
  humidity_3:
    name: "Humidité ${piece_3}"
  co2:
    id: ibus_co2
    name: "CO2"
  varhr:
    id: ibus_varhr
    name: "Variation humidite"
  pwm1:
    name: "PWM QAI 1 (brut)"
  pwm2:
    name: "PWM QAI 2 (brut)"

# Requested-mode selector: mirrors ESP32 persisted/queued mode, not confirmed VMC feedback.
select:
  - platform: template
    name: "iBUS Mode VMC"
    id: ibus_mode_vmc
    update_interval: 5s
    lambda: |-
      switch (id(easyhome_ibus).get_requested_mode()) {
        case 0x10: return std::string("Programmation");
        case 0x21: return std::string("Vacances");
        case 0x43: return std::string("Quotidien");
        case 0x65: return std::string("Boost");
        case 0x87: return std::string("Invites");
        default: return std::string("Quotidien");
      }
    options:
      - "Programmation"
      - "Vacances"
      - "Quotidien"
      - "Boost"
      - "Invites"
    set_action:
      - lambda: |-
          if (x == "Programmation") id(easyhome_ibus).queue_mode(0x10);
          else if (x == "Vacances") id(easyhome_ibus).queue_mode(0x21);
          else if (x == "Quotidien") id(easyhome_ibus).queue_mode(0x43);
          else if (x == "Boost") id(easyhome_ibus).queue_mode(0x65);
          else if (x == "Invites") id(easyhome_ibus).queue_mode(0x87);

# Maintenance action displayed under Home Assistant Diagnostics.
button:
  - platform: restart
    name: "Redemarrer Aldes EasyHome"
    entity_category: diagnostic

# Experimental QAI model: maximum of humidity variation and CO2 contribution.
sensor:
  - platform: copy
    source_id: ibus_varhr
    name: "QAI Humidite"
    device_class: aqi
    entity_category: diagnostic
    accuracy_decimals: 0

  - platform: template
    id: ibus_qai_co2
    name: "QAI contribution CO2"
    device_class: aqi
    accuracy_decimals: 1
    entity_category: diagnostic
    filters:
      - lambda: return roundf(x * 10.0f) / 10.0f;
    update_interval: 10s
    lambda: |-
      if (!id(ibus_co2).has_state()) return NAN;
      return 0.065f * id(ibus_co2).state - 28.0f;

  - platform: template
    id: ibus_qai_index
    name: "QAI Index"
    device_class: aqi
    accuracy_decimals: 1
    filters:
      - lambda: return roundf(x * 10.0f) / 10.0f;
    update_interval: 10s
    lambda: |-
      if (!id(ibus_co2).has_state() || !id(ibus_varhr).has_state()) return NAN;
      return std::min(100.0f, std::max(0.0f, std::max(id(ibus_varhr).state, 0.065f * id(ibus_co2).state - 28.0f)));

text_sensor:
  - platform: template
    name: "Polluant dominant"
    update_interval: 10s
    lambda: |-
      if (!id(ibus_co2).has_state() || !id(ibus_varhr).has_state())
        return {};
      const float qai_co2 = 0.065f * id(ibus_co2).state - 28.0f;
      return std::string(id(ibus_varhr).state >= qai_co2 ? "Humidité" : "CO2");

# GPIO25 remains the reserved UART TX / power LED; do not drive it here.
output:
  - platform: gpio
    id: ibus_rx_led
    pin: GPIO26
  - platform: gpio
    id: ibus_wifi_led
    pin: GPIO27

globals:
  - id: ibus_wifi_led_tick
    type: uint32_t
    restore_value: no
    initial_value: '0'

# Wi-Fi connection: 1 s ON / 1 s OFF.
# Wi-Fi connected, ESPHome API disconnected: 0.5 s ON / 0.5 s OFF.
# Both connected: LED ON.
interval:
  - interval: 500ms
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - if:
                condition:
                  api.connected:
                then:
                  - output.turn_on: ibus_wifi_led
                else:
                  - lambda: |-
                      id(ibus_wifi_led_tick)++;
                      if (id(ibus_wifi_led_tick) & 1) id(ibus_wifi_led).turn_on();
                      else id(ibus_wifi_led).turn_off();
          else:
            - lambda: |-
                id(ibus_wifi_led_tick)++;
                if ((id(ibus_wifi_led_tick) / 2) & 1) id(ibus_wifi_led).turn_on();
                else id(ibus_wifi_led).turn_off();
