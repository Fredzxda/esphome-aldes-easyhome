# Release package v1.2.0. Import from GitHub with packages:
#   easyhome: github://Fredzxda/esphome-aldes-easyhome/packages/easyhome.yaml@main
#
# Manual Boost TX test: inverted TX GPIO1, RX GPIO3.
# Optional room labels supplied by the consuming YAML: piece_1, piece_2, piece_3.
external_components:
  - source:
      type: git
      url: https://github.com/Fredzxda/esphome-aldes-easyhome
      ref: humidite-corrigee
    components: [aldes_ibus]
    refresh: always

uart:
  # Reserve UART0 without using the iBUS pins; ESPHome assigns UARTs in declaration order.
  - id: uart_reserve
    tx_pin: GPIO32
    baud_rate: 9600

  - id: easyhome_uart
    tx_pin:
      number: GPIO1
      inverted: true
    rx_pin:
      number: GPIO3
      inverted: false
    baud_rate: 2400
    data_bits: 8
    parity: EVEN
    stop_bits: 1
    rx_buffer_size: 1024

aldes_ibus:
  id: easyhome_ibus
  uart_id: easyhome_uart
  rx_led: ibus_rx_led_gated
  connected:
    name: "iBUS Connecté"
    entity_category: diagnostic
  raw_rx:
    name: "iBUS RX brut hex"  # VMC response only; TX echo excluded
  last_frame:
    name: "iBUS Derniere trame VMC"
  last_long_frame:
    name: "iBUS Derniere trame longue VMC"
  frames_ok:
    name: "iBUS Trames valides"
  checksum_bad:
    name: "iBUS Checksums invalides"
  sync_errors:
    name: "iBUS Erreurs de synchronisation"
  rx_bytes:
    name: "iBUS Octets recus"
  temperature_1:
    name: "Température ${piece_1}"
  humidity_1:
    name: "Humidité ${piece_1}"
  temperature_2:
    name: "Température ${piece_2}"
  humidity_2:
    name: "Humidité ${piece_2}"
  temperature_3:
    name: "Température ${piece_3}"
  humidity_3:
    name: "Humidité ${piece_3}"
  co2:
    id: ibus_co2
    name: "CO2"
  varhr:
    id: ibus_varhr
    name: "Variation humidite"
  pwm1:
    name: "PWM Actuel"
    entity_category: diagnostic
  pwm2:
    name: "PWM Cible QAI"
    entity_category: diagnostic
  self_controlled:
    name: "Self Controlled"
  actual_mode:
    name: "Mode VMC Actuel"

# Requested-mode selector: mirrors ESP32 persisted/queued mode, not confirmed VMC feedback.
select:
  - platform: template
    name: "Mode VMC Demandé"
    id: ibus_mode_vmc
    update_interval: 5s
    lambda: |-
      switch (id(easyhome_ibus).get_requested_mode()) {
        case 0x10: return std::string("Programmation");
        case 0x21: return std::string("Vacances");
        case 0x43: return std::string("Quotidien");
        case 0x65: return std::string("Boost");
        case 0x87: return std::string("Invites");
        default: return std::string("Quotidien");
      }
    options:
      - "Programmation"
      - "Vacances"
      - "Quotidien"
      - "Boost"
      - "Invites"
    set_action:
      - lambda: |-
          if (x == "Programmation") id(easyhome_ibus).queue_mode(0x10);
          else if (x == "Vacances") id(easyhome_ibus).queue_mode(0x21);
          else if (x == "Quotidien") id(easyhome_ibus).queue_mode(0x43);
          else if (x == "Boost") id(easyhome_ibus).queue_mode(0x65);
          else if (x == "Invites") id(easyhome_ibus).queue_mode(0x87);

# Maintenance action displayed under Home Assistant Diagnostics.
button:
  - platform: restart
    name: "Redemarrer Aldes EasyHome"
    entity_category: diagnostic

# Local QAI reconstruction from historical Aldes cloud records (see docs/qai-reconstruction.md).
# Raw iBUS humidity is used; VarHR is NOT the humidity QAI.
# All QAI entities stay unavailable until the three humidity probes and CO2 are received.
sensor:
# Development-only diagnostics: remove all six before merging to main.
# Values are independent of the display switch and do not feed internal calculations.
  - platform: template
    name: "Diagnostic humidité brute ${piece_1}"
    entity_category: diagnostic
    device_class: humidity
    state_class: measurement
    unit_of_measurement: "%"
    accuracy_decimals: 2
    update_interval: 10s
    lambda: 'return id(easyhome_ibus).get_raw_humidity(0);'

  - platform: template
    name: "Diagnostic humidité corrigée ${piece_1}"
    entity_category: diagnostic
    device_class: humidity
    state_class: measurement
    unit_of_measurement: "%"
    accuracy_decimals: 2
    update_interval: 10s
    lambda: 'return id(easyhome_ibus).get_corrected_humidity(0);'

  - platform: template
    name: "Diagnostic humidité brute ${piece_2}"
    entity_category: diagnostic
    device_class: humidity
    state_class: measurement
    unit_of_measurement: "%"
    accuracy_decimals: 2
    update_interval: 10s
    lambda: 'return id(easyhome_ibus).get_raw_humidity(1);'

  - platform: template
    name: "Diagnostic humidité corrigée ${piece_2}"
    entity_category: diagnostic
    device_class: humidity
    state_class: measurement
    unit_of_measurement: "%"
    accuracy_decimals: 2
    update_interval: 10s
    lambda: 'return id(easyhome_ibus).get_corrected_humidity(1);'

  - platform: template
    name: "Diagnostic humidité brute ${piece_3}"
    entity_category: diagnostic
    device_class: humidity
    state_class: measurement
    unit_of_measurement: "%"
    accuracy_decimals: 2
    update_interval: 10s
    lambda: 'return id(easyhome_ibus).get_raw_humidity(2);'

  - platform: template
    name: "Diagnostic humidité corrigée ${piece_3}"
    entity_category: diagnostic
    device_class: humidity
    state_class: measurement
    unit_of_measurement: "%"
    accuracy_decimals: 2
    update_interval: 10s
    lambda: 'return id(easyhome_ibus).get_corrected_humidity(2);'

  - platform: template
    id: ibus_qai_humid_wet
    name: "QAI humidite elevee"
    device_class: aqi
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 10s
    lambda: 'return id(easyhome_ibus).qai_humidity_wet();'

  - platform: template
    id: ibus_qai_humid_dry
    name: "QAI air sec"
    device_class: aqi
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 10s
    lambda: 'return id(easyhome_ibus).qai_humidity_dry();'

  - platform: template
    id: ibus_qai_humidity
    name: "QAI Humidite"
    device_class: aqi
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 10s
    lambda: 'return id(easyhome_ibus).qai_humidity();'

  - platform: template
    id: ibus_qai_co2
    name: "QAI contribution CO2"
    device_class: aqi
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 10s
    lambda: 'return id(easyhome_ibus).qai_co2();'

  - platform: template
    id: ibus_qai_index
    name: "QAI Index"
    device_class: aqi
    accuracy_decimals: 0
    update_interval: 10s
    lambda: 'return id(easyhome_ibus).qai_index();'

text_sensor:
  - platform: template
    name: "Version firmware Aldes"
    entity_category: diagnostic
    icon: mdi:information-outline
    lambda: 'return {"1.2.0"};'
    update_interval: 60s
  - platform: template
    name: "Polluant dominant"
    update_interval: 10s
    lambda: |-
      const float humidity = id(easyhome_ibus).qai_humidity();
      const float co2 = id(easyhome_ibus).qai_co2();
      if (std::isnan(humidity) || std::isnan(co2)) return {};
      return std::string(humidity >= co2 ? "Humidité" : "CO2");

# GPIO25 is released from the UART reservation; verify LED polarity on the PCB.
output:
  - platform: gpio
    id: ibus_power_led
    pin: GPIO25
  - platform: gpio
    id: ibus_rx_led_physical
    pin: GPIO26
  - platform: template
    id: ibus_rx_led_gated
    type: binary
    write_action:
      - if:
          condition:
            lambda: 'return !id(ibus_night_mode) && state;'
          then:
            - output.turn_on: ibus_rx_led_physical
          else:
            - output.turn_off: ibus_rx_led_physical
  - platform: gpio
    id: ibus_wifi_led
    pin: GPIO27

# User controls in Home Assistant (not diagnostic entities).
switch:
  - platform: template
    id: ibus_humidity_corrected
    name: "Afficher humidités corrigées"
    icon: mdi:water-percent
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: 'id(easyhome_ibus).set_corrected_humidity_enabled(true);'
    on_turn_off:
      - lambda: 'id(easyhome_ibus).set_corrected_humidity_enabled(false);'
  - platform: template
    id: ibus_night_enabled
    name: "Mode nuit LEDs"
    icon: mdi:weather-night
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - script.execute: ibus_update_led_night_mode
    on_turn_off:
      - script.execute: ibus_update_led_night_mode

datetime:
  - platform: template
    id: ibus_night_start
    type: time
    name: "Début mode nuit LEDs"
    icon: mdi:clock-start
    optimistic: true
    restore_value: true
    initial_value: "23:00:00"
    on_value:
      then:
        - script.execute: ibus_update_led_night_mode
  - platform: template
    id: ibus_night_end
    type: time
    name: "Fin mode nuit LEDs"
    icon: mdi:clock-end
    optimistic: true
    restore_value: true
    initial_value: "07:00:00"
    on_value:
      then:
        - script.execute: ibus_update_led_night_mode

time:
  - platform: homeassistant
    id: ibus_local_time
    on_time_sync:
      then:
        - script.execute: ibus_update_led_night_mode

globals:
  - id: ibus_night_mode
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ibus_wifi_led_tick
    type: uint32_t
    restore_value: no
    initial_value: '0'

# Light POWER immediately at ESPHome startup, before Home Assistant time sync.
# Reevaluate at first valid time synchronization and periodically afterwards.
esphome:
  on_boot:
    priority: 600
    then:
      - output.turn_on: ibus_power_led

script:
  - id: ibus_update_led_night_mode
    mode: restart
    then:
      - lambda: |-
          auto now = id(ibus_local_time).now();
          if (!id(ibus_night_enabled).state || !now.is_valid()) {
            id(ibus_night_mode) = false;
            return;
          }
          const int minute_now = now.hour * 60 + now.minute;
          const int start = id(ibus_night_start).hour * 60 + id(ibus_night_start).minute;
          const int end = id(ibus_night_end).hour * 60 + id(ibus_night_end).minute;
          id(ibus_night_mode) = start < end ? (minute_now >= start && minute_now < end)
                                : start > end ? (minute_now >= start || minute_now < end)
                                              : false;
      - if:
          condition:
            lambda: 'return id(ibus_night_mode);'
          then:
            - output.turn_off: ibus_power_led
            - output.turn_off: ibus_rx_led_physical
            - output.turn_off: ibus_wifi_led
          else:
            - output.turn_on: ibus_power_led
interval:
  - interval: 30s
    then:
      - script.execute: ibus_update_led_night_mode
  - interval: 500ms
    then:
      - if:
          condition:
            lambda: 'return id(ibus_night_mode);'
          then:
            - output.turn_off: ibus_wifi_led
          else:
            - if:
                condition:
                  wifi.connected:
                then:
                  - if:
                      condition:
                        api.connected:
                      then:
                        - output.turn_on: ibus_wifi_led
                      else:
                        - lambda: |-
                            id(ibus_wifi_led_tick)++;
                            if (id(ibus_wifi_led_tick) & 1) id(ibus_wifi_led).turn_on();
                            else id(ibus_wifi_led).turn_off();
                else:
                  - lambda: |-
                      id(ibus_wifi_led_tick)++;
                      if ((id(ibus_wifi_led_tick) / 2) & 1) id(ibus_wifi_led).turn_on();
                      else id(ibus_wifi_led).turn_off();
