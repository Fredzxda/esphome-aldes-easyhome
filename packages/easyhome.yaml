# Development package. Import from GitHub with packages:
#   easyhome: github://Fredzxda/esphome-aldes-easyhome/packages/easyhome.yaml@dev/ibus-rx
#
# Manual Boost TX test: inverted TX GPIO1, RX GPIO3.
external_components:
  - source:
      type: git
      url: https://github.com/Fredzxda/esphome-aldes-easyhome
      ref: dev/ibus-rx
    components: [aldes_ibus]
    refresh: always

uart:
  # Reserve UART0 without using the iBUS pins; ESPHome assigns UARTs in declaration order.
  - id: uart_reserve
    tx_pin: GPIO25
    baud_rate: 9600

  - id: easyhome_uart
    tx_pin:
      number: GPIO1
      inverted: true
    rx_pin:
      number: GPIO3
      inverted: false
    baud_rate: 2400
    data_bits: 8
    parity: EVEN
    stop_bits: 1
    rx_buffer_size: 1024

aldes_ibus:
  id: easyhome_ibus
  uart_id: easyhome_uart
  raw_rx:
    name: "iBUS RX brut hex"
  last_frame:
    name: "iBUS Derniere trame VMC"
  frames_ok:
    name: "iBUS Trames valides"
  checksum_bad:
    name: "iBUS Checksums invalides"
  sync_errors:
    name: "iBUS Erreurs de synchronisation"
  rx_bytes:
    name: "iBUS Octets recus"

# Command selector. State is optimistic until VMC status feedback is wired in.
select:
  - platform: template
    name: "iBUS Mode VMC"
    id: ibus_mode_vmc
    optimistic: true
    options:
      - "Programmation"
      - "Vacances"
      - "Quotidien"
      - "Boost"
      - "Invites"
    set_action:
      - lambda: |-
          if (x == "Programmation") id(easyhome_ibus).queue_mode(0x10);
          else if (x == "Vacances") id(easyhome_ibus).queue_mode(0x21);
          else if (x == "Quotidien") id(easyhome_ibus).queue_mode(0x43);
          else if (x == "Boost") id(easyhome_ibus).queue_mode(0x65);
          else if (x == "Invites") id(easyhome_ibus).queue_mode(0x87);

# Maintenance action displayed under Home Assistant Diagnostics.
button:
  - platform: restart
    name: "Redemarrer Aldes EasyHome"
    entity_category: diagnostic
