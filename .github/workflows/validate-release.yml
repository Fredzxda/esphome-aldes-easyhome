name: Validate ESPHome and release version
on:
  pull_request:
    branches: [main, humidite-corrigee]
  push:
    branches: [main, humidite-corrigee, 'dev/**']
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        profile: [development, production]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test automatic production cleanup
        run: python -m unittest discover -s tests -v
      - name: Check version consistency
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        run: |
          python - <<'PY'
          import os,re
          from pathlib import Path
          package=Path('packages/easyhome.yaml').read_text()
          example=Path('examples/aldes-easyhome.yaml').read_text()
          versions=[re.search(p,s,re.M).group(1) for p,s in [
            (r'^# Release package v(\d+\.\d+\.\d+)\b',package),
            (r'return\s+\{"(\d+\.\d+\.\d+)"\};',package),
            (r'^# ESPHome EasyHome v(\d+\.\d+\.\d+)\b',example)]]
          assert len(set(versions))==1,versions
          tag=os.environ.get('RELEASE_TAG')
          assert not tag or tag=='v'+versions[0],tag
          PY
      - name: Install ESPHome
        run: python -m pip install 'esphome==2026.10.1'
      - name: Prepare offline profile
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          if [ "$PROFILE" = production ]; then
            python scripts/prepare_ci.py --production
          else
            python scripts/prepare_ci.py
          fi
      - name: Validate and compile
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          esphome config ".ci-build/$PROFILE/device.yaml"
          esphome compile ".ci-build/$PROFILE/device.yaml"
