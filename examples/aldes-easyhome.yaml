# Development example. Replace secrets with your local ESPHome secrets.
substitutions:
  device_name: aldes-easyhome
  friendly_name: Aldes EasyHome
  ibus_rx_pin: GPIO16  # EXAMPLE ONLY: replace with verified RX pin

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret aldes_easyhome_api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

packages:
  easyhome: github://Fredzxda/esphome-aldes-easyhome/packages/easyhome.yaml@dev/ibus-rx
