# ESPHome EasyHome v1.1.0 example. Replace secrets with your local ESPHome secrets.
substitutions:
  device_name: aldes-easyhome
  friendly_name: Aldes EasyHome
  # Adaptez les noms des trois bouches / pièces à votre installation.
  piece_1: Cuisine
  piece_2: Baignoire
  piece_3: Douche

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  baud_rate: 0  # Disable UART0 serial logs; GPIO3 is used for iBUS RX
  level: ERROR  # Production: show only errors

api:
  encryption:
    key: !secret aldes_easyhome_api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

packages:
  easyhome: github://Fredzxda/esphome-aldes-easyhome/packages/easyhome.yaml@dev/vmc-mode-control
